# Proof Test Configuration - 3 samples, no Claude
# Purpose: Prove text and structured data CAN be loaded by processors

# Data paths
data:
  step1_cohort_train: "./cohorts/proof_test_3.csv"
  step1_cohort_val: "./cohorts/proof_test_3.csv"

  # Local validation_data_subset paths
  mimic_cxr_base: "../validation_data_subset/cxr"
  mimic_iv_base: "../validation_data_subset/mimic-iv"
  mimic_ed_base: "../validation_data_subset/mimic-ed"

  # CXR-PRO reports location
  cxr_pro_reports: "../validation_data_subset/cxr-pro/mimic_train_impressions.csv"

  # DICOM metadata (view position, patient orientation, image dimensions)
  dicom_metadata_path: "/media/dev/MIMIC_DATA/mimic-cxr-jpg/mimic-cxr-2.0.0-metadata.csv.gz"

  # Output
  output_base: "./output/proof_test"

# Image processing
image:
  preserve_full_resolution: true
  target_size: null
  normalize_method: "minmax"
  augmentation:
    enabled: false
  use_memory_mapping: true
  cache_processed: false

# Structured data
structured:
  missing_token: "NOT_DONE"
  use_missing_flags: true
  temporal_features:
    enabled: true
    include_time_since_admission: true
    include_measurement_count: true
    include_ordinal_index: true
    include_time_between_measurements: true
  encoding_method: "aggregated"

  priority_labs:
    - "wbc"
    - "hemoglobin"
    - "hematocrit"
    - "platelets"
    - "sodium"
    - "potassium"
    - "chloride"
    - "bicarbonate"
    - "bun"
    - "creatinine"
    - "glucose"

  priority_vitals:
    - "temperature"
    - "heartrate"
    - "resprate"
    - "o2sat"
    - "sbp"
    - "dbp"

# Text processing - NO CLAUDE
text:
  ner:
    model: "en_core_sci_md"
    extract_entities: true

  retrieval:
    use_entity_based: true
    use_semantic_fallback: true
    max_sentences: 20
    similarity_threshold: 0.3

  # DISABLED: Skip Claude summarization to save cost/time
  summarization:
    use_claude: false
    model: "claude-sonnet-4-5-20250929"
    max_summary_length: 500
    temperature: 0.0
    system_prompt: "You are a medical expert summarizing clinical notes for chest X-ray interpretation."

  tokenizer:
    model: "emilyalsentzer/Bio_ClinicalBERT"
    max_length: 512
    padding: "max_length"
    truncation: true

  note_rewriting:
    enabled: false

# Processing
processing:
  batch_size: 1
  num_workers: 0  # Single-threaded for debugging
  use_gpu: false
  device: "cpu"
  verbose: true
  log_every_n: 1

# Debug
debug:
  enabled: true
  max_samples: 3
  save_intermediate: true
  skip_on_error: false  # Fail loudly to see errors
